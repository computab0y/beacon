apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: beacon
resources:
- ../../base

# CI (.github/workflows/ci.yaml) rewrites newTag and the version label on every
# build of main; Argo CD then rolls the new image out.
images:
- name: beacon
  newName: ghcr.io/computab0y/beacon
  newTag: 1.0.0-c26aa60
labels:
- includeTemplates: true
  pairs:
    app.kubernetes.io/version: 1.0.0

    # EDB PGD group homelab-pgd: connect through the PGD connection manager
    # (routes to the current write leader) and use the replicated "app" DB.
# Single-node cluster: one replica (the PDB is dropped from the base).
    # EDB PGD group homelab-pgd: connect through the PGD connection manager
    # (routes to the current write leader) and use the replicated "app" DB.
patches:
- patch: |-
    - op: replace
      path: /data/VAULT_ADDR
      value: https://vault-vault.apps.okd.funky-bash.com
    # EDB PGD group homelab-pgd: connect through the PGD connection manager
    # (routes to the current write leader) and use the replicated "app" DB.
    - op: replace
      path: /data/DB_HOST
      value: homelab-pgd-proxy.pgd-group-homelab.svc
    - op: replace
      path: /data/DB_NAME
      value: app
  target:
    kind: ConfigMap
    name: beacon-config
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: beacon
