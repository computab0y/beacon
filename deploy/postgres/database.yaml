# Declarative database on your existing EDB Postgres for Kubernetes cluster
# (Database CRD, PG4K >= 1.25). The owner role "beacon" is a managed role on
# the Cluster - see README.md in this folder. Tables are created by the app's
# migration Job, inside schema "beacon".
apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Database
metadata:
  name: beacon
spec:
  name: beacon
  owner: beacon
  ensure: present
  databaseReclaimPolicy: retain
  cluster:
    name: pg-main            # <-- your PG4K Cluster name
