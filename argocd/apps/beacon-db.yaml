apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beacon-db
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"     # database before the app
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/beacon.git
    targetRevision: main
    path: deploy/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres                   # <-- PG4K Cluster namespace
  syncPolicy:
    automated: {prune: false, selfHeal: true}   # never prune a database
