name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["deploy/**", "argocd/**", "grafana/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # commit the new image tag back for Argo CD
  packages: write     # push to GHCR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Render manifests
        run: |
          kubectl kustomize deploy/overlays/okd > /dev/null
          kubectl kustomize deploy/postgres > /dev/null
          kubectl kustomize grafana > /dev/null

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version="$(cat VERSION)"
          image="ghcr.io/${GITHUB_REPOSITORY_computab0y,,}/beacon"
          echo "version=${version}"                     >> "$GITHUB_OUTPUT"
          echo "tag=${version}-${GITHUB_SHA::7}"         >> "$GITHUB_OUTPUT"
          echo "image=${image}"                         >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # GitOps: bump the overlay; Argo CD notices the commit and syncs.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update image tag and version label
        working-directory: deploy/overlays/okd
        run: |
          kustomize edit set image "beacon=${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}"
          sed -i -E "s|(app.kubernetes.io/version: ).*|\1${{ needs.build.outputs.version }}|" kustomization.yaml
          git diff
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/okd/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: beacon ${{ needs.build.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
